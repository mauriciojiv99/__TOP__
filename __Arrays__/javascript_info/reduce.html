<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reduce</title>
  </head>
  <body>
    <script>
      let numbers = [1, 3, 5, 7, 9];
      let sumOfNumbers = numbers.reduce(
        (sum, nextNumber) => sum + nextNumber,
        0,
      );
      console.log(sumOfNumbers);
    </script>
  </body>
</html>
